# Clash Verge Rev 全局扩展配置：本机路由与 DNS。

profile:
  store-selected: true

tun:
  strict-route: true
  # 第一阶段显式清空订阅配置中的排除项；DNS 链路验证通过后再单独加入内网排除。
  route-exclude-address: []
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  listen: 127.0.0.1:1053
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  nameserver-policy:
    # Google服务 由 script.js 生成；规则集和关键域名共用同一持久化手动出口。
    "rule-set:google": "https://1.1.1.1/dns-query#Google服务"
    "+.google.com": "https://1.1.1.1/dns-query#Google服务"
    "+.google.com.hk": "https://1.1.1.1/dns-query#Google服务"
    "+.google": "https://1.1.1.1/dns-query#Google服务"
    "+.goog": "https://1.1.1.1/dns-query#Google服务"
    "+.gstatic.com": "https://1.1.1.1/dns-query#Google服务"
    "+.googleapis.com": "https://1.1.1.1/dns-query#Google服务"
    "+.googleusercontent.com": "https://1.1.1.1/dns-query#Google服务"
    "+.gvt1.com": "https://1.1.1.1/dns-query#Google服务"
    "+.gvt2.com": "https://1.1.1.1/dns-query#Google服务"
    "+.gvt3.com": "https://1.1.1.1/dns-query#Google服务"
    "+.ggpht.com": "https://1.1.1.1/dns-query#Google服务"
    "+.googletagmanager.com": "https://1.1.1.1/dns-query#Google服务"
    "+.google-analytics.com": "https://1.1.1.1/dns-query#Google服务"
