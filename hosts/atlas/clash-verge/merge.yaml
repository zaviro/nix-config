# Clash Verge Rev 全局扩展配置：本机路由、DNS 与 Tailscale。

profile:
  store-selected: true

tun:
  strict-route: true
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

dns:
  enable: true
  listen: 127.0.0.1:1053
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  nameserver-policy:
    "*.ts.net": 100.100.100.100
